version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_exemplo
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: user_wordpress
      MYSQL_PASSWORD: user_password_exemplo
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: user_wordpress
      WORDPRESS_DB_PASSWORD: user_password_exemplo
      WORDPRESS_DB_NAME: wordpress_db
    depends_on:
      - db
    networks:
      - backend
      - frontend

networks:
  frontend:
  backend:

volumes:
  db_data:
